<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pocket Racing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         ГЛАВНОЕ МЕНЮ
    ================================= -->

    <section id="mainMenu" class="screen">

        <h1>POCKET RACING</h1>

        <p class="subtitle">
            Уличные гонки<br>
            Твоя машина. Твоя победа.
        </p>

        <div class="buttons">

            <button type="button" onclick="openGarage()">
                НАЧАТЬ ИГРУ
            </button>

            <button
                type="button"
                onclick="showMessage('Выбор гонки пока в разработке')">
                ВЫБОР ГОНКИ
            </button>

            <button
                type="button"
                onclick="showMessage('Профиль пока в разработке')">
                ПРОФИЛЬ
            </button>

        </div>

        <p id="message"></p>

    </section>


    <!-- ================================
         ГАРАЖ
    ================================= -->

    <section id="garage" class="screen hidden">

        <button
            class="backButton"
            type="button"
            onclick="backToMenu()">
            ← НАЗАД
        </button>

        <h1>🏎️ ГАРАЖ</h1>

        <div class="car">

            <div class="carImage">

                <img
                    src="./car1.png"
                    alt="Dodge Charger Demon"
                >

            </div>

            <h2>Dodge Charger Demon</h2>

            <p>⭐ Уровень 1</p>

            <div class="stats">

                <p>⚡ Мощность: <b>98</b></p>

                <p>🏁 Скорость: <b>94</b></p>

                <p>🎮 Управление: <b>76</b></p>

            </div>

        </div>

        <div class="money">
            💰 Монеты:
            <b id="money">1 000</b>
        </div>

        <div class="buttons">

            <button
                type="button"
                onclick="startRace()">
                🏁 В ГОНКУ
            </button>

            <button
                type="button"
                onclick="showGarageMessage('Тюнинг пока в разработке')">
                🔧 ТЮНИНГ
            </button>

            <button
                type="button"
                onclick="showGarageMessage('Коллекция пока в разработке')">
                📦 КОЛЛЕКЦИЯ
            </button>

        </div>

        <p id="garageMessage"></p>

    </section>


    <!-- ================================
         ГОНКА
    ================================= -->

    <section id="race" class="screen hidden">

        <button
            class="backButton"
            type="button"
            onclick="openGarage()">
            ← ГАРАЖ
        </button>

        <h1>🏁 ГОНКА</h1>

        <div class="raceCars">

            <!-- ИГРОК -->

            <div class="raceCar">

                <img
                    src="./car1.png"
                    alt="Dodge Charger Demon"
                >

                <h2>Dodge Charger Demon</h2>

            </div>


            <!-- VS -->

            <div class="vs">
                VS
            </div>


            <!-- ПОЛИЦИЯ -->

            <div class="raceCar">

                <img
                    src="./car2.png"
                    alt="Police"
                    style="
                        display: block;
                        width: min(380px, 100%);
                        height: auto;
                        max-height: 280px;
                        object-fit: contain;
                        margin: 0 auto;
                    "
                >

                <h2>🚓 Police</h2>

            </div>

        </div>


        <!-- =============================
             ИНФОРМАЦИЯ
        ============================== -->

        <div class="raceInfo">

            <p>
                🏆 Счёт:
                <b id="raceScore">0 : 0</b>
            </p>

            <p id="raceMessage">
                Готов к гонке?
            </p>

        </div>


        <!-- =============================
             КНОПКА АТАКИ
        ============================== -->

        <div class="buttons">

            <button
                id="attackButton"
                type="button">
                🔥 АТАКОВАТЬ
            </button>

        </div>

    </section>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="game.js"></script>
    <script src="race.js?v=2"></script>

</body>

</html>
