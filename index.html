<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гонки</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>POCKET RACING</h1>

<p class="subtitle">
    Уличные гонки

    Твоя машина. Твоя победа.
</p>

    <div class="buttons">
        <button onclick="openGarage()">НАЧАТЬ ИГРУ</button>
        <button onclick="showMessage('Выбор гонки пока в разработке')">
            ВЫБОР ГОНКИ
        </button>
        <button onclick="showMessage('Профиль пока в разработке')">
            ПРОФИЛЬ
        </button>
    </div>

    <p id="message"></p>
</section>

<section id="garage" class="screen hidden">

    <button class="backButton" onclick="backToMenu()">
        ← НАЗАД
    </button>

    <h1>🏎️ ГАРАЖ</h1>

    <div class="car">

        <div class="carImage">
            <img src="images/car1.png" alt="Dodge Charger Demon">
        </div>

        <h2>Dodge Charger Demon</h2>

        <p>⭐ Уровень 1</p>

        <div class="stats">
            <p>⚡ Мощность: <b>98</b></p>
            <p>🏁 Скорость: <b>94</b></p>
            <p>🎮 Управление: <b>76</b></p>
        </div>

    </div>

    <div class="playerStats">

    <div class="money">
        💰 Монеты: <b id="money">1000</b>
    </div>

    <div class="level">
        🏆 Уровень: <b id="level">1</b>
    </div>

    <div class="experience">
        ⭐ Опыт:
        <b id="experience">0</b> /
        <b id="nextLevel">50</b>
    </div>

</div>

    <div class="buttons">

        <button onclick="startRace()">
            🏁 В ГОНКУ
        </button>

        <button onclick="showGarageMessage('Тюнинг пока в разработке')">
            🔧 ТЮНИНГ
        </button>

        <button onclick="showGarageMessage('Коллекция пока в разработке')">
            📦 КОЛЛЕКЦИЯ
        </button>

    </div>

    <p id="garageMessage"></p>

</section>

<section id="race" class="screen hidden">

    <button class="backButton" onclick="openGarage()">
        ← ГАРАЖ
    </button>

    <h1>🏁 ГОНКА</h1>

    <div class="raceCars">

        <div class="raceCar">

            <img
                src="images/car1.png"
                alt="Dodge Charger Demon"
            >

            <h2>Dodge Charger Demon</h2>

        </div>

        <div class="vs">
            VS
        </div>

        <div class="raceCar">

            <img
                src="images/car2.png"
                alt="Police"
            >

            <h2>🚓 Police</h2>

        </div>

    </div>

    <div class="raceInfo">

        <p>
            🏆 Счёт:
            <b id="raceScore">0 : 0</b>
        </p>

        <p id="raceMessage">
            Готов к гонке?
        </p>

    </div>

    <div class="buttons">

        <button
    id="attackButton"
    type="button"
    onclick="attack()"
>
    🔥 АТАКОВАТЬ
</button>

    </div>

</section>

<script src="game.js"></script>
<script src="race.js"></script>

</body>
</html>
