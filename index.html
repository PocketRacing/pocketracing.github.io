<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гонки: Big Boss (Локальная версия)</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #1e1e2e 0%, #2a2a3e 50%, #111 100%);
            color: white; display: flex; justify-content: center; align-items: center;
        }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); z-index: 1; pointer-events: none; }
        .container {
            position: relative; z-index: 2; text-align: center; width: 360px;
            padding: 30px; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { color: #00d2d3; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; text-shadow: 0 0 15px rgba(0, 210, 211, 0.5); }
        input { width: 100%; padding: 15px; font-size: 18px; border-radius: 12px; border: none; outline: none; background: rgba(255,255,255,0.95); color: #333; margin-bottom: 10px; }
        button {
            width: 100%; padding: 16px; font-size: 18px; cursor: pointer;
            background: linear-gradient(45deg, #ff4757, #ff6b81); color: white;
            border: none; border-radius: 12px; font-weight: bold;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4); transition: all 0.2s;
        }
        button:hover { transform: scale(1.02); box-shadow: 0 12px 25px rgba(255, 71, 87, 0.6); }
        button:active { transform: scale(0.98); }
        #accountMessage { margin-top: 15px; min-height: 24px; font-weight: bold; }
        
        .stats-panel {
            margin-top: 25px; text-align: left; background: rgba(0, 0, 0, 0.5);
            padding: 20px; border-radius: 15px; border: 1px solid rgba(0, 210, 211, 0.3);
        }
        .stat-row { margin: 8px 0; font-size: 17px; display: flex; justify-content: space-between; }
        .money-val { color: #00d2d3; font-weight: bold; font-size: 1.2em; }
        .gold-val { color: gold; font-weight: bold; font-size: 1.2em; }

        .screen { display: none; animation: fadeIn 0.5s ease; }
        #loginScreen { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Экран гонки */
        #raceScreen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .race-track {
            width: 80%; height: 400px; border: 4px solid #555; background: #222;
            position: relative; overflow: hidden; margin-bottom: 20px;
        }
        .car {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 80px; background: red;
            clip-path: polygon(0 20%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%);
            box-shadow: 0 0 10px white; transition: bottom 2s linear;
        }
        #carElement { bottom: 10px !important; }
        .race-controls { margin-top: 20px; display: flex; gap: 15px; }
        .race-btn {
            padding: 15px 30px; font-size: 18px; background: #00d2d3;
            color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .race-status { font-size: 24px; font-weight: bold; margin-top: 10px; min-height: 30px; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <!-- ЭКРАН ВХОДА -->
        <div id="loginScreen" class="screen">
            <h1>Гараж</h1>
            <p style="color: #aaa;">Введи имя гонщика:</p>
            <input type="text" id="playerNameInput" placeholder="Имя" value="Big Boss">
            <button onclick="createAccount()">Войти в гараж</button>
            <div id="accountMessage"></div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="mainMenu" class="screen">
            <h1 id="playerTitle">Профиль</h1>
            <div class="stats-panel">
                <div class="stat-row"><span>Имя:</span> <span id="statName">--</span></div>
                <div class="stat-row"><span>Деньги:</span> <span class="money-val" id="statMoney">0</span></div>
                <div class="stat-row"><span>Золото:</span> <span class="gold-val" id="statGold">0</span></div>
                <div class="stat-row"><span>Уровень:</span> <span id="statLevel">1</span></div>
            </div>
            <button id="raceBtn" onclick="startRace()">СТАРТ ГОНКИ</button>
        </div>
    </div>

    <!-- ЭКРАН ГОНКИ -->
    <div id="raceScreen" class="screen">
        <h1 style="color: #00d2d3;">ГОНКА!</h1>
        <p style="color: #aaa; margin-bottom: 20px;">Доедь до финиша!</p>
        <div class="race-track">
            <div id="carElement" class="car"></div>
