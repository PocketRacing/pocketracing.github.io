<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гараж: Вход</title>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2d2d2d;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
        }
        input {
            padding: 12px;
            width: 80%;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 12px 24px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #e84118;
        }
        #status-message {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏁 Гараж Гонщика</h2>
        <p>Введи своё имя, чтобы начать игру!</p>
        
        <!-- Поле ввода имени -->
        <input type="text" id="player-name" placeholder="Например: Big Boss">
        
        <!-- Кнопка -->
        <button onclick="createAccount()">Войти в гараж</button>
        
        <!-- Место для сообщения на экране (опционально) -->
        <div id="status-message"></div>
    </div>

    <script>
        // 👇 ВСТАВЬ СЮДА СВОИ КЛЮЧИ ИЗ SUPABASE (Settings -> API)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5anZraXVzeWl5bGNrYXVqaml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTk5NzksImV4cCI6MjEwMjU3NTk3OX0.rNZX3L-LET6tHe3juirf2DI7cuKOhSEcReXSUHhoSjI';
        // 👆

        // Инициализация клиента Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('✅ Supabase клиент создан');

        async function createAccount() {
            const nameInput = document.getElementById('player-name');
            const statusDiv = document.getElementById('status-message');
            
            if (!nameInput.value) {
                statusDiv.textContent = '⚠️ Введи имя!';
                statusDiv.style.color = '#f1c40f';
                return;
            }

            const playerName = nameInput.value.trim();
            statusDiv.textContent = `💾 Поиск профиля для: ${playerName}...`;
            statusDiv.style.color = '#fff';

            try {
                // 1. Пытаемся найти игрока по имени в таблице players
                const { data, error } = await supabase
                    .from('players')
                    .select('*')
                    .eq('name', playerName);

                if (error) {
                    console.error('❌ Ошибка запроса:', error);
                    statusDiv.textContent = '❌ Ошибка базы данных. Проверь консоль (F12).';
                    statusDiv.style.color = '#ff4757';
                    return;
                }

                // Если игрок найден
                if (data && data.length > 0) {
                    const player = data[0];
                    console.log(`✅ Профиль найден! Привет, ${player.name}`);
                    console.log(`💰 Баланс: ${player.balance}$`);
                    
                    statusDiv.textContent = `✅ Привет, ${player.name}! Баланс: ${player.balance}$`;
                    statusDiv.style.color = '#2ed573';
                    
                    // Тут можно добавить переход на следующий экран
                    alert(`Гараж открыт! Баланс: ${player.balance}$`);
                } 
                // Если игрока нет — создаём нового
                else {
                    console.log(`🆕 Игрока нет, создаём новый профиль...`);
                    statusDiv.textContent = '🆕 Создаём новый профиль...';
                    statusDiv.style.color = '#fff';

                    const { data: newData, error: newError } = await supabase
                        .from('players')
                        .insert([{ name: playerName, balance: 50000 }]);

                    if (newError) {
                        console.error('❌ Ошибка создания:', newError);
                        statusDiv.textContent = '❌ Не удалось создать профиль.';
                        return;
                    }

                    console.log(`✅ Профиль создан! Баланс: 50000$`);
                    statusDiv.textContent = `✅ Профиль создан! Баланс: 50000$`;
                    statusDiv.style.color = '#2ed573';

                    alert(`Гараж открыт! Ты получил стартовые 50000$.`);
                }
            } catch (err) {
                console.error('💥 Критическая ошибка:', err);
                statusDiv.textContent = '💥 Что-то пошло не так. Смотри консоль.';
            }
        }
    </script>
</body>
</html>
