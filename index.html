<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гараж: Вход</title>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2d2d2d;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
        }
        input {
            padding: 12px;
            width: 80%;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 12px 24px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #e84118;
        }
        #status-message {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏁 Гараж Гонщика</h2>
        <p>Введи своё имя, чтобы начать игру!</p>
        
        <input type="text" id="player-name" placeholder="Например: Turbo">
        <button onclick="createAccount()">Войти в гараж</button>
        <div id="status-message"></div>
    </div>

    <script>
        // 1. Твои ключи
        const SUPABASE_URL = 'https://qyjvkiusyiylckaujjiv.supabase.co/rest/v1/players_new'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_dwxrSiVkIY5C8PKu--_UlA_phF5hvRy';

        // 2. Инициализация БЕЗ const, чтобы не было конфликта
        // Мы просто присваиваем значение объекту, который уже создала библиотека
        supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('✅ Клиент Supabase готов к работе!');

        // 3. Сама функция (теперь браузер её точно увидит, если нет ошибок выше)
        async function createAccount() {
            const nameInput = document.getElementById('player-name');
            const statusDiv = document.getElementById('status-message');
            
            if (!nameInput.value) {
                statusDiv.textContent = '⚠️ Введи имя!';
                statusDiv.style.color = '#f1c40f';
                return;
            }

            const playerName = nameInput.value.trim();
            statusDiv.textContent = `💾 Поиск профиля для: ${playerName}...`;
            statusDiv.style.color = '#fff';

            try {
                const { data, error } = await supabase
                    .from('players')
                    .select('*')
                    .eq('name', playerName);

                if (error) {
                    console.error('❌ Ошибка запроса:', error);
                    statusDiv.textContent = '❌ Ошибка базы данных. Смотри консоль.';
                    return;
                }

                if (data && data.length > 0) {
                    const player = data[0];
                    statusDiv.textContent = `✅ Привет, ${player.name}! Баланс: ${player.balance}$`;
                    statusDiv.style.color = '#2ed573';
                    alert(`Гараж открыт! Баланс: ${player.balance}$`);
                } else {
                    statusDiv.textContent = '🆕 Создаём новый профиль...';
                    
                    const { data: newData, error: newError } = await supabase
                        .from('players')
                        .insert([{ name: playerName, balance: 50000 }]);

                    if (newError) {
                        console.error('❌ Ошибка создания:', newError);
                        statusDiv.textContent = '❌ Не удалось создать профиль.';
                        return;
                    }

                    statusDiv.textContent = `✅ Профиль создан! Баланс: 50000$`;
                    statusDiv.style.color = '#2ed573';
                    alert(`Гараж открыт! Ты получил стартовые 50000$.`);
                }
            } catch (err) {
                console.error('💥 Критическая ошибка:', err);
                statusDiv.textContent = '💥 Что-то пошло не так.';
            }
        }
    </script>
</body>
</html>
