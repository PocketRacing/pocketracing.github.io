<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pocket Racing</title>

<body>

    <!-- СОЗДАНИЕ АККАУНТА -->

    <section id="accountScreen" class="screen">

        <h1>POCKET RACING</h1>

        <p class="subtitle">
            Создай своего гонщика
        </p>

        <div class="accountCard">

            <input
                id="playerNameInput"
                type="text"
                maxlength="20"
                placeholder="Введите имя"
                autocomplete="off"
            >

            <button
                type="button"
                id="createPlayerButton"
                onclick="createAccount()">
                🏎️ СОЗДАТЬ ГОНЩИКА
            </button>

            <p id="accountMessage"></p>

        </div>

    </section>

    <!-- ГЛАВНОЕ МЕНЮ -->

    <section id="mainMenu" class="screen hidden">

        <h1>POCKET RACING</h1>

        <p class="subtitle">
            Добро пожаловать,
            <b id="menuPlayerName">Гонщик</b>!
        </p>

        <div class="balanceBar">

            <span>
                💰 <b id="menuMoney">1000</b>
            </span>

            <span>
                💎 <b id="menuGold">0</b>
            </span>

            <span>
                ⭐ <b id="menuXP">0</b>
            </span>

        </div>

        <div class="buttons">

            <button
                type="button"
                onclick="openGarage()">
                🏎️ ГАРАЖ
            </button>

            <button
                type="button"
                onclick="showMessage('Выбор гонки пока в разработке')">
                🏁 ВЫБОР ГОНКИ
            </button>

            <button
                type="button"
                onclick="openProfile()">
                👤 ПРОФИЛЬ
            </button>

            <button
                type="button"
                onclick="openShop()">
                💎 МАГАЗИН
            </button>

        </div>

        <p id="message"></p>

    </section>

    <!-- ГАРАЖ -->

    <section id="garage" class="screen hidden">

        <button
            class="backButton"
            type="button"
            onclick="backToMenu()">
            ← НАЗАД
        </button>

        <h1>🏎️ ГАРАЖ</h1>

        <div class="car">

            <div class="carImage">

                <img
                    src="./car1.png"
                    alt="Dodge Charger Demon"
                >

            </div>

            <h2>Dodge Charger Demon</h2>

            <p>
                👤 <b id="garagePlayerName">Гонщик</b>
            </p>

            <p>
                🏆 Уровень:
                <b id="playerLevel">1</b>
            </p>

            <div class="stats">

                <p>
                    ⚡ Мощность:
                    <b>98</b>
                </p>

                <p>
                    🏁 Скорость:
                    <b>94</b>
                </p>

                <p>
                    🎮 Управление:
                    <b>76</b>
                </p>

            </div>

        </div>

        <div class="money">

            💰 Монеты:
            <b id="money">1000</b>

            

      

Золото:
            <b id="garageGold">0</b>

            

       

P:
            <b id="garageXP">0</b>

        </div>

        <div class="buttons">

            <button
                type="button"
                onclick="startRace()">
                🏁 В ГОНКУ
            </button>

            <button
                type="button"
                onclick="showGarageMessage('Тюнинг пока в разработке')">
                🔧 ТЮНИНГ
            </button>

            <button
                type="button"
                onclick="showGarageMessage('Коллекция пока в разработке')">
                📦 КОЛЛЕКЦИЯ
            </button>

        </div>

        <p id="garageMessage"></p>

    </section>
