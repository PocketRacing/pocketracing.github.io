<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гонки: База данных</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .screen { display: none; text-align: center; }
        #loginScreen { display: block; }
        input { padding: 10px; font-size: 16px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 5px; margin-top: 10px; }
        button:hover { background: #e84118; }
        #accountMessage { margin-top: 15px; color: #f1f2f6; min-height: 20px; }
        #mainMenu { display: none; }
        h1 { color: #48dbfb; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="loginScreen" class="screen">
        <h1>ГОНКИ: ВХОД</h1>
        <p>Введи имя гонщика (например, Big Boss):</p>
        <input type="text" id="playerNameInput" placeholder="Имя гонщика" value="Big Boss">
        <br>
        <button onclick="createAccount()">ВОЙТИ</button>
        <div id="accountMessage"></div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ (ПОКА СКРЫТО) -->
    <div id="mainMenu" class="screen">
        <h1>ГЛАВНОЕ МЕНЮ</h1>
        <p id="playerStats">Загрузка...</p>
        <button onclick="startRace()">СТАРТ ГОНКИ</button>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ИНИЦИАЛИЗАЦИЯ КЛЮЧЕЙ -->
    <script>
        const SUPABASE_URL = "https://qyjvkiusyiylckaujjiv.supabase.co";
        
        // !!! ТВОЙ КЛЮЧ ANON (скопирован из твоих данных) !!!
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5anZraXVzeWl5bGNrYXVqaml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTk5NzksImV4cCI6MjEwMjU3NTk3OX0.rNZX3L-LET6tHe3juirf2DI7cuKOhSEcReXSUHhoSjI";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("✅ Supabase успешно подключен!");
    </script>

    <!-- ТВОЙ ИГРОВОЙ ЛОГИК (ВСЁ ВНУТРИ) -->
    <script>
        let player = null;

        // Функция сохранения в браузере (чтобы не пропадало при обновлении)
        function saveLocal() {
            if (player) localStorage.setItem('my_racer', JSON.stringify(player));
        }

        // Загрузка из браузера
        function loadLocal() {
            const saved = localStorage.getItem('my_racer');
            if (saved) {
                player = JSON.parse(saved);
                updateStats();
            }
        }

        function updateStats() {
            const statsEl = document.getElementById('playerStats');
            if (statsEl && player) {
                statsEl.textContent = `Игрок: ${player.name} | Деньги: ${player.money} | Уровень: ${player.level}`;
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
            document.getElementById(screenId).style.display = 'block';
        }

        async function createAccount() {
            const input = document.getElementById("playerNameInput");
            const message = document.getElementById("accountMessage");

            if (!input || !message) return;

            const name = input.value.trim();
            if (name.length < 2) {
                message.textContent = "⚠️ Имя должно быть минимум из 2 символов.";
                return;
            }

            message.textContent = "⏳ Проверка базы данных...";
            console.log(`🔍 Пытаемся найти игрока: "${name}"`);

            try {
                let dbData = null;

                // 1. Пытаемся получить данные из Supabase
                if (typeof supabase !== 'undefined') {
                    try {
                        // Ищем в таблице players колонку username. 
                        // Если у тебя колонка называется name - поменяй слово 'username' на 'name' здесь.
                        const { data, error } = await supabase
                            .from('players')
                            .select('*')
                            .eq('username', name) 
                            .maybeSingle();

                        if (error) {
                            console.warn("⚠️ Ошибка базы (игнорируем):", error.message);
                        } else {
                            dbData = data;
                        }
                    } catch (e) {
                        console.error("💥 Критическая ошибка базы:", e);
                    }
                }

                // 2. ЕСЛИ НАШЛИ В БАЗЕ
                if (dbData) {
                    console.log("✅ Игрок найден в базе!", dbData);
                    player = {
                        id: dbData.id,
                        name: dbData.username,
                        money: Number(dbData.money) || 1000,
                        gold: Number(dbData.gold) || 0,
                        experience: Number(dbData.experience) || 0,
                        level: Number(dbData.level) || 1
                    };
                    saveLocal();
                    updateStats();
                    message.textContent = `✅ Привет, ${player.name}! Данные загружены из базы.`;
                    setTimeout(() => showScreen("mainMenu"), 600);
                    return;
                }

                // 3. ЕСЛИ НЕ НАШЛИ (или база недоступна) -> СОЗДАЕМ ЛОКАЛЬНО
                console.log("🆕 Игрока нет в базе или база недоступна. Создаем локальный профиль.");
                player = {
                    id: Date.now(),
                    name: name,
                    money: 1000,
                    gold: 0,
                    experience: 0,
                    level: 1
                };
                saveLocal();
                updateStats();
                message.textContent = "✅ Гонщик создан (локально). Игра работает!";
                setTimeout(() => showScreen("mainMenu"), 600);

            } catch (error) {
                console.error("💥 Полный сбой:", error);
                message.textContent = "❌ Ошибка системы. Смотри консоль (F12).";
            }
        }

        function startRace() {
            alert("🚀 Гонка началась! (Здесь будет логика гонки)");
        }

        // При загрузке страницы пробуем загрузить сохраненного игрока (если есть)
        window.onload = () => {
            loadLocal();
            // Если игрок уже есть, можно сразу показать меню, но для теста оставим вход
        };
    </script>
</body>
</html>
