<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гонки: Big Boss</title>
    
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            /* Если у тебя есть картинка bg.jpg — она встанет сюда. Если нет — будет стильный тёмный фон */
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Затемнение, чтобы текст читался на любой картинке */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 350px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { color: #00d2d3; text-transform: uppercase; margin-bottom: 10px; }
        
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            outline: none;
            box-sizing: border-box;
            background: rgba(255,255,255,0.9);
            color: #333;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        #accountMessage { margin-top: 15px; min-height: 20px; font-weight: bold; }

        .stats {
            margin-top: 20px;
            text-align: left;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 10px;
        }
        .stat-row { margin: 5px 0; font-size: 18px; }
        .money-color { color: #00d2d3; font-weight: bold; }
        .gold-color { color: gold; font-weight: bold; }

        .screen { display: none; animation: fadeIn 0.4s; }
        #loginScreen { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <!-- ЭКРАН ВХОДА -->
        <div id="loginScreen" class="screen">
            <h1>Гараж гонщика</h1>
            <p>Введи имя:</p>
            <input type="text" id="playerNameInput" placeholder="Имя" value="Big Boss">
            <button onclick="createAccount()">Войти в гараж</button>
            <div id="accountMessage"></div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="mainMenu" class="screen">
            <h1 id="playerTitle">Профиль</h1>
            
            <div class="stats">
                <div class="stat-row"><strong>Имя:</strong> <span id="statName">--</span></div>
                <div class="stat-row money-color"><strong>Деньги:</strong> $<span id="statMoney">0</span></div>
                <div class="stat-row gold-color"><strong>Золото:</strong> 🪙<span id="statGold">0</span></div>
                <div class="stat-row"><strong>Уровень:</strong> <span id="statLevel">1</span></div>
            </div>

            <button id="raceBtn" onclick="startRace()">СТАРТ ГОНКИ</button>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // --- НАСТРОЙКИ (ТВОЙ КЛЮЧ УЖЕ ЗДЕСЬ) ---
        const SUPABASE_URL = "https://qyjvkiusyiylckaujjiv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5anZraXVzeWl5bGNrYXVqaml2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTk5NzksImV4cCI6MjEwMjU3NTk3OX0.rNZX3L-LET6tHe3juirf2DI7cuKOhSEcReXSUHhoSjI";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("✅ Supabase подключен!");

        let player = null;

        function saveLocal() {
            if (player) localStorage.setItem('my_racer_save', JSON.stringify(player));
        }

        function loadLocal() {
            const saved = localStorage.getItem('my_racer_save');
            if (saved) {
                player = JSON.parse(saved);
                updateStatsUI();
            }
        }

        function updateStatsUI() {
            if (!player) return;
            document.getElementById('statName').textContent = player.name;
            document.getElementById('statMoney').textContent = player.money;
            document.getElementById('statGold').textContent = player.gold;
            document.getElementById('statLevel').textContent = player.level;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
            document.getElementById(screenId).style.display = 'block';
        }

        async function createAccount() {
            const input = document.getElementById("playerNameInput");
            const message = document.getElementById("accountMessage");

            if (!input || !message) return;

            const name = input.value.trim();
            if (name.length < 2) {
                message.textContent = "⚠️ Имя слишком короткое!";
                return;
            }

            message.textContent = "⏳ Проверка базы...";
            console.log(`🔍 Ищем игрока: "${name}"`);

            try {
                let dbData = null;

                // Пытаемся взять из базы
                if (typeof supabase !== 'undefined') {
                    try {
                        const { data, error } = await supabase
                            .from('players')
                            .select('*')
                            .eq('username', name) 
                            .maybeSingle();

                        if (error) console.warn("⚠️ Ошибка базы:", error.message);
                        else dbData = data;
                    } catch (e) { console.error(e); }
                }

                if (dbData) {
                    console.log("✅ Игрок найден в базе!");
                    player = {
                        id: dbData.id,
                        name: dbData.username,
                        money: Number(dbData.money) || 5000,
                        gold: Number(dbData.gold) || 0,
                        experience: Number(dbData.experience) || 0,
                        level: Number(dbData.level) || 1
                    };
                    message.textContent = `✅ Привет, ${player.name}! Данные из базы.`;
                } else {
                    // ЕСЛИ БАЗЫ НЕТ — ДАЁМ КРУТОЙ БАЛАНС (50к денег)
                    console.log("🆕 Базы нет, создаём локально с крутым балансом.");
                    player = {
                        id: Date.now(),
                        name: name,
                        money: 50000,   // <-- ВОТ ОН, ТВОЙ БАЛАНС
                        gold: 100,      // <-- И ЗОЛОТО
                        experience: 0,
                        level: 1
                    };
                    message.textContent = `✅ Профиль создан! Баланс: ${player.money}$`;
                }

                saveLocal();
                updateStatsUI();
                setTimeout(() => showScreen("mainMenu"), 600);

            } catch (error) {
                console.error("💥 Ошибка:", error);
                message.textContent = "❌ Ошибка системы. Смотри консоль (F12).";
            }
        }

        function startRace() {
            if (!player) return;

            const cost = 500;
            const minReward = 1000;
            const maxReward = 3000;

            if (player.money < cost) {
                alert("❌ Недостаточно денег! Нужно " + cost + "$.");
                return;
            }

            const btn = document.getElementById('raceBtn');
            btn.disabled = true;
            btn.textContent = "🏁 Гонка идёт...";

            setTimeout(() => {
                const winChance = Math.random(); // 0.0 - 1.0
                const reward = Math.floor(Math.random() * (maxReward - minReward)) + minReward;
                
                if (winChance > 0.3) {
                    player.money += reward;
                    alert(`🎉 Победа! Ты заработал ${reward}$!`);
                } else {
                    alert("💥 Ты проиграл заезд, но получил опыт!");
                    player.experience += 50;
                }

                player.money -= cost; // Платим за участие в любом случае
                saveLocal();
                updateStatsUI();

                btn.disabled = false;
                btn.textContent = "СТАРТ ГОНКИ";
            }, 2000);
        }

        window.onload = loadLocal;
    </script>
</body>
</html>
